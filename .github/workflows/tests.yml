name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install test dependencies
        run: pip install pytest pyflakes numpy

      - name: Lint (advisory)
        run: pyflakes model.py model_500m.py memory.py tokenizer.py stdp.py homeostasis.py graph_builder.py train_utils.py evaluate.py train_memory.py || true

      - name: Run tests
        run: pytest tests/ -v
